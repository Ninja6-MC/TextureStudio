# The check itself lives in Ninja6-MC/.github and is maintained in one place; this file
# is only the caller. Copied from that repo's templates/dco-stub.yml.
name: DCO

on:
  pull_request:
  merge_group:

# The caller's top-level grant. A called workflow's permissions are CAPPED by what the
# caller grants, so this has to cover what the reusable workflow asks for - it requests
# `contents: read` and nothing more, so this is exactly enough.
permissions:
  contents: read

# Reusable workflow referenced from Ninja6-MC/.github
jobs:
  dco:
    uses: Ninja6-MC/.github/.github/workflows/dco.yml@70e00c7cd9f3064f494b3b9e7d65301d91c93c0c # main @ 2026-09-17
